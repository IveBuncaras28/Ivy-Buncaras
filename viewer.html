<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/script.js"></script>
<script>
(async function(){
  const titleEl = document.getElementById('v-title');
  const metaEl = document.getElementById('v-meta');
  const bodyEl = document.getElementById('v-body');
  const id = new URLSearchParams(location.search).get('id');

  if(!dbReady()){ titleEl.textContent = 'Not connected'; notConfiguredNotice(bodyEl); return; }
  if(!id){ titleEl.textContent = 'Not found'; bodyEl.innerHTML = '<div class="empty">No material was specified.</div>'; return; }

  let m;
  try{ m = await fetchLmsMaterialById(id); }
  catch(e){ titleEl.textContent = 'Error'; bodyEl.innerHTML = `<div class="empty">Couldn't load this material: ${escapeHtml(e.message)}</div>`; return; }
  if(!m){ titleEl.textContent = 'Not found'; bodyEl.innerHTML = '<div class="empty">This material doesn\'t exist.</div>'; return; }

  document.title = m.title + ' — Ivy B. Buncaras';
  titleEl.textContent = m.title;
  metaEl.textContent = `${m.grade_level} · ${m.subject} · ${m.material_type}`;

  // ----- Track as "recently viewed" (per-browser, local only) -----
  try{
    let recent = JSON.parse(localStorage.getItem('lms_recent') || '[]');
    recent = recent.filter(x => x !== m.id);
    recent.unshift(m.id);
    localStorage.setItem('lms_recent', JSON.stringify(recent.slice(0, 12)));
  }catch(e){}

  // ----- Article: Britannica-style reading view -----
  if(m.material_type === 'Article'){
    const words = (m.body||'').trim().split(/\s+/).filter(Boolean).length;
    const mins = Math.max(1, Math.round(words / 200));
    const lastUpdated = m.updated_at || m.created_at;
    bodyEl.innerHTML = `
      <div class="encyclopedia-meta">Last updated ${fmtDate(lastUpdated)} · ${mins} min read${m.description ? ' · ' + escapeHtml(m.description) : ''}</div>
      <div class="encyclopedia-rule"></div>
      <div class="encyclopedia-layout">
        <aside class="encyclopedia-toc" id="v-toc"></aside>
        <div class="post-body encyclopedia-body" id="v-article-body">${renderMarkdown(m.body || '*No content yet.*')}</div>
      </div>
    `;
    const headings = document.querySelectorAll('#v-article-body h2, #v-article-body h3');
    const toc = document.getElementById('v-toc');
    if(headings.length >= 2){
      const links = [];
      headings.forEach((h, i) => {
        const slug = 'sec-' + i + '-' + h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
        h.id = slug;
        links.push(`<a href="#${slug}" class="toc-${h.tagName.toLowerCase()}">${escapeHtml(h.textContent)}</a>`);
      });
      toc.innerHTML = `<div class="toc-label">In this lesson</div>${links.join('')}`;
    } else {
      toc.style.display = 'none';
    }
    if(window.obs) obs();
    return;
  }

  // ----- File-based material: inline preview + download -----
  const downloadBtn = m.file_url ? `<a class="btn p" href="${m.file_url}" target="_blank" rel="noopener" download>Download</a>` : '';
  const openLinkBtn = m.link_url ? `<a class="btn s" href="${m.link_url}" target="_blank" rel="noopener">Open Link →</a>` : '';

  let previewHtml = '';
  if(m.file_url){
    const ext = (m.file_url.split('?')[0].split('.').pop() || '').toLowerCase();
    const officeExts = ['doc','docx','ppt','pptx','xls','xlsx'];
    if(ext === 'pdf'){
      previewHtml = `<div class="viewer-frame-wrap"><iframe src="${m.file_url}"></iframe></div>`;
    } else if(officeExts.includes(ext)){
      const officeUrl = 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(m.file_url);
      previewHtml = `<div class="viewer-frame-wrap"><iframe src="${officeUrl}"></iframe></div>`;
    } else {
      previewHtml = `<div class="viewer-fallback">Preview isn't available for this file type — use Download to view it.</div>`;
    }
  } else {
    previewHtml = `<div class="viewer-fallback">${m.link_url ? 'This material links to an external resource.' : 'No file attached to this material yet.'}</div>`;
  }

  bodyEl.innerHTML = `
    <div class="viewer-head">
      <p style="color:var(--muted);max-width:60ch;margin:0">${escapeHtml(m.description||'')}</p>
      <div class="viewer-actions">${downloadBtn} ${openLinkBtn}</div>
    </div>
    ${previewHtml}
  `;
  if(window.obs) obs();
})();
</script>
</body></html>
