<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<nav><div class="wrap"><a class="brand" href="index.html">Ivy B. Buncaras</a>

<header class="page-hero"><div class="wrap">
<div class="eyebrow">Bookshelf</div>
<h1>Library</h1>
<p>Books I keep coming back to — and a few queued up next.</p>
</div></header>
<section id="library"><div class="wrap">
<div class="filters reveal" id="lib-filters"></div>
<div class="grid" id="library-grid"><div class="loading">Loading books…</div></div>
<div class="pagination" id="library-pagination">
  <button class="page-btn" id="library-prev">← Previous</button>
  <span class="page-indicator" id="library-page-label"></span>
  <button class="page-btn" id="library-next">Next →</button>
</div>
</div></section>
<footer id="contact-footer">
<div class="eyebrow" style="color:var(--gold-l)">Get in touch</div>
<h2 style="font-size:30px;margin:12px 0 18px">Let's build something that lasts</h2>
<div id="social"></div>
<p style="font-size:13px;color:#9aa3c0;margin-top:24px">© <span id="yr"></span> Ivy B. Buncaras · Masbate, Philippines</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/script.js"></script>
<script>
(async function(){
  const grid = document.getElementById('library-grid');
  const filtersEl = document.getElementById('lib-filters');
  if(!dbReady()){ notConfiguredNotice(grid); return; }
  let books = [];
  try{ books = await fetchBooks(); }
  catch(e){ grid.innerHTML = '<div class="empty">Couldn\'t load the library right now.</div>'; return; }
  if(!books.length){ filtersEl.style.display='none'; grid.innerHTML = '<div class="empty">No books added yet.</div>'; return; }

  const stars = n => Array.from({length:5},(_,i)=>`<span class="${i<n?'':'off'}">★</span>`).join('');
  const bookCard = b => `<article class="card reveal book">
      ${b.cover_url ? `<img src="${b.cover_url}" alt="" class="book-cover">` : ''}
      <span class="shelf-badge">${escapeHtml(b.shelf)}</span>
      ${b.rating ? `<div class="stars">${stars(b.rating)}</div>` : ''}
      <h3>${escapeHtml(b.title)}</h3>
      ${b.author ? `<div class="author">${escapeHtml(b.author)}</div>` : ''}
      <p>${escapeHtml(b.description||'')}</p>
      ${b.file_url ? `<a class="more" href="${b.file_url}" target="_blank" rel="noopener">Download →</a> ` : ''}
      ${b.link_url ? `<a class="more" href="${b.link_url}" target="_blank" rel="noopener">More →</a>` : ''}
    </article>`;

  let currentShelf = 'All';
  const paginator = makePaginator(
    () => books.filter(b => currentShelf==='All' || b.shelf===currentShelf),
    6,
    pageItems => { grid.innerHTML = pageItems.map(bookCard).join(''); if(window.obs) obs(); },
    document.getElementById('library-pagination'),
    document.getElementById('library-prev'),
    document.getElementById('library-next'),
    document.getElementById('library-page-label')
  );
  const shelves = ['All', ...new Set(books.map(b=>b.shelf))];
  filtersEl.innerHTML = shelves.map((s,i)=>`<button class="${i?'':'on'}">${escapeHtml(s)}</button>`).join('');
  filtersEl.querySelectorAll('button').forEach(btn => btn.onclick = () => {
    filtersEl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on'); currentShelf = btn.textContent; paginator.reset();
  });
  paginator.render();
})();
</script>
</body></html>
