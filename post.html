<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post — Ivy B. Buncaras</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<nav><div class="wrap"><a class="brand" href="index.html">Ivy B. Buncaras</a>
<div class="links"><a href="about.html">About</a><a href="projects.html">Projects</a><a href="research.html">Research</a><a href="library.html">Library</a><a href="dashboard.html">Dashboard PH</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a></div></div></nav>
<header class="page-hero"><div class="wrap">
<div class="eyebrow"><a href="blog.html" style="color:var(--gold-l)">← Back to Blog</a></div>
<h1 id="post-title">Loading…</h1>
<p id="post-date"></p>
</div></header>
<section><div class="wrap">
<img id="post-cover" class="post-cover-full" style="display:none" src="" alt="">
<article class="post-body reveal" id="post-body"><div class="loading">Loading post…</div></article>

<div class="comments reveal" id="comments-wrap" style="display:none">
<h3>Comments</h3>
<div id="comments-list"></div>
<form class="cform" id="comment-form">
  <input type="text" id="c-name" placeholder="Your name" required maxlength="80">
  <textarea id="c-body" placeholder="Add to the discussion…" required maxlength="2000"></textarea>
  <button class="btn p" type="submit" style="width:fit-content">Post Comment</button>
  <div id="c-msg"></div>
</form>
</div>
</div></section>
<footer id="contact-footer">
<div class="eyebrow" style="color:var(--gold-l)">Get in touch</div>
<h2 style="font-size:30px;margin:12px 0 18px">Let's build something that lasts</h2>
<div id="social"></div>
<p style="font-size:13px;color:#9aa3c0;margin-top:24px">© <span id="yr"></span> Ivy B. Buncaras · Masbate, Philippines</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/script.js"></script>
<script>
(async function(){
  const slug = new URLSearchParams(location.search).get('slug');
  const titleEl = document.getElementById('post-title');
  const bodyEl = document.getElementById('post-body');
  if(!dbReady()){ titleEl.textContent='Not connected'; notConfiguredNotice(bodyEl); return; }
  if(!slug){ titleEl.textContent='Post not found'; bodyEl.innerHTML='<div class="empty">No post was specified.</div>'; return; }
  let post;
  try{ post = await fetchPostBySlug(slug); }
  catch(e){ titleEl.textContent='Error'; bodyEl.innerHTML='<div class="empty">Couldn\'t load this post.</div>'; return; }
  if(!post){ titleEl.textContent='Post not found'; bodyEl.innerHTML='<div class="empty">This post doesn\'t exist or isn\'t published.</div>'; return; }

  document.title = post.title + ' — Ivy B. Buncaras';
  titleEl.textContent = post.title;
  document.getElementById('post-date').textContent = fmtDate(post.created_at);
  if(post.cover_url){ const c=document.getElementById('post-cover'); c.src=post.cover_url; c.style.display='block'; }
  bodyEl.innerHTML = renderMarkdown(post.body || '');

  const wrap = document.getElementById('comments-wrap');
  wrap.style.display = 'block';
  const list = document.getElementById('comments-list');
  async function loadComments(){
    try{
      const cs = await fetchApprovedComments(post.id);
      list.innerHTML = cs.length ? cs.map(c => `
        <div class="comment"><div class="who">${escapeHtml(c.name)}<span class="when">${fmtDate(c.created_at)}</span></div>
        <div class="body">${escapeHtml(c.body)}</div></div>`).join('')
        : '<p style="color:var(--muted);font-size:14px">No comments yet — be the first.</p>';
    }catch(e){ list.innerHTML=''; }
  }
  loadComments();

  document.getElementById('comment-form').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const name = document.getElementById('c-name').value.trim();
    const body = document.getElementById('c-body').value.trim();
    const msg = document.getElementById('c-msg');
    if(!name || !body) return;
    try{
      await submitComment(post.id, name, body);
      msg.innerHTML = '<div class="msg ok">Thanks! Your comment is awaiting approval and will appear once reviewed.</div>';
      document.getElementById('comment-form').reset();
    }catch(e){
      msg.innerHTML = '<div class="msg err">Something went wrong — please try again.</div>';
    }
  });

  if(window.obs) obs();
})();
</script>
</body></html>
