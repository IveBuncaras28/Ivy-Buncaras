<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/script.js"></script>
<script>
(async function(){
  const grid=document.getElementById('research-grid');
  if(!dbReady()){ notConfiguredNotice(grid); return; }
  let items=[];
  try{ items=await fetchResearch(); }
  catch(e){ grid.innerHTML='<div class="empty">Couldn\'t load research right now.</div>'; return; }
  if(!items.length){ grid.innerHTML='<div class="empty">No papers added yet.</div>'; return; }

  const card=r=>`
    <article class="card reveal">
      ${r.cover_url?`<img src="${r.cover_url}" alt="" class="card-cover">`:''}
      <div class="chips"><span class="chip">${escapeHtml(r.venue)}</span></div>
      <h3>${escapeHtml(r.title)}</h3>
      <p>${escapeHtml(r.description||'')}</p>
      ${r.file_url?`<a class="more" href="${r.file_url}" target="_blank" rel="noopener">Download →</a> `:''}
      ${r.link_url?`<a class="more" href="${r.link_url}" target="_blank" rel="noopener">Read paper →</a>`:''}
    </article>`;
  const paginator=makePaginator(
    ()=>items,
    6,
    pageItems=>{ grid.innerHTML=pageItems.map(card).join(''); if(window.obs) obs(); },
    document.getElementById('research-pagination'),
    document.getElementById('research-prev'),
    document.getElementById('research-next'),
    document.getElementById('research-page-label')
  );
  paginator.render();
})();
</script>
